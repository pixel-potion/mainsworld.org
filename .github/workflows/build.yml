# The merge gate. Runs the exact production build Cloudflare runs
# (`npm ci` then `npm run build` = docusaurus build) on the Node pinned in
# `.node-version`, on every PR and every push to main. A broken build — a bad
# MDX link, a broken doc reference — fails the PR check here, with readable
# logs, instead of only surfacing as a red Cloudflare deploy after merge.
name: Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:registry
      - if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'catalog-maintenance') }}
        run: npm run apps:check -- --base "${{ github.event.pull_request.base.sha }}"
      - if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'catalog-maintenance') }}
        run: npm run apps:check -- --base "${{ github.event.pull_request.base.sha }}" --allow-maintenance
      - if: ${{ github.event_name == 'push' }}
        run: npm run apps:check
      - run: node --test tests/legal-pages.test.mjs
      - run: npm run build
